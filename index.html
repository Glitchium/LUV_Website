<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUV® — DROP 001</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{
background:#050505;
color:white;
overflow-x:hidden;
}



button{
cursor:pointer;
}





/* PASSWORD */


#login{

position:fixed;
inset:0;

background:
radial-gradient(circle at center,#222,#000);

display:flex;
align-items:center;
justify-content:center;
flex-direction:column;

z-index:999;

}



.heart{

font-size:80px;

animation:pulse 2s infinite;

}



#login h1{

font-size:90px;

letter-spacing:25px;

}



#login p{

letter-spacing:5px;

opacity:.5;

}



input{

margin-top:40px;

background:none;

border:1px solid #555;

padding:18px 40px;

color:white;

text-align:center;

}



.loginBtn{

margin-top:20px;

padding:18px 60px;

border:none;

background:white;

font-weight:bold;

}





#error{

margin-top:20px;

color:red;

}







/* NAV */


nav{

position:fixed;

top:0;

width:100%;

padding:30px 7%;

display:flex;

justify-content:space-between;

align-items:center;

z-index:20;

background:rgba(0,0,0,.5);

backdrop-filter:blur(20px);

}



.logo{

font-size:40px;

font-weight:900;

letter-spacing:15px;

}



.logo span{

animation:pulse 2s infinite;

}



nav button{

padding:15px 30px;

border:none;

}






/* HERO */


.hero{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

}



.hero h1{

font-size:27vw;

letter-spacing:-25px;

font-weight:900;

animation:intro 2s;

}



.hero p{

letter-spacing:8px;

opacity:.5;

}



.hero h3{

margin-top:30px;

}



.stock{

font-size:35px;

margin:40px;

}







/* PRODUCT */


.drop{

padding:120px 8%;

}



.drop h2{

font-size:80px;

}



.product{

display:grid;

grid-template-columns:1fr 1fr;

gap:80px;

margin-top:80px;

}






/* SHIRT MOCKUP */


.viewer{

height:500px;

display:flex;

justify-content:center;

align-items:center;

perspective:1000px;

}



.shirt{

height:400px;

width:320px;

background:#111;

border-radius:45px;

display:flex;

justify-content:center;

align-items:center;

font-size:45px;

font-weight:900;

animation:float 5s infinite;

box-shadow:0 50px 120px rgba(255,255,255,.08);

}



.shirt small{

font-size:12px;

}







/* DETAILS */


.info h1{

font-size:45px;

}



.info p{

opacity:.6;

margin:30px 0;

}



.size button{

padding:15px 20px;

margin:5px;

background:none;

color:white;

border:1px solid white;

}



.size button.active{

background:white;

color:black;

}



.selected{

margin-top:20px;

opacity:.6;

}



.add{

margin-top:40px;

width:100%;

padding:20px;

border:none;

background:white;

font-weight:bold;

}






/* CART */


.cart{

position:fixed;

right:-450px;

top:0;

width:420px;

height:100vh;

background:white;

color:black;

padding:40px;

z-index:100;

transition:.5s;

}



.cart.open{

right:0;

}



.cartTop{

display:flex;

justify-content:space-between;

}



.close{

font-size:35px;

background:none;

border:none;

}



.cartItem{

margin-top:25px;

padding-bottom:20px;

border-bottom:1px solid #ccc;

}



.cartItem button{

padding:5px 12px;

margin:5px;

}





.checkout{

position:absolute;

bottom:40px;

left:40px;

right:40px;

padding:20px;

background:black;

color:white;

border:none;

}




.overlay{

position:fixed;

inset:0;

background:black;

opacity:0;

pointer-events:none;

z-index:50;

transition:.3s;

}



.overlay.show{

opacity:.7;

pointer-events:auto;

}






.about{

height:60vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

}



.about h1{

font-size:60px;

}




footer{

padding:50px;

text-align:center;

opacity:.5;

}






@keyframes pulse{

50%{

transform:scale(1.2);

}

}



@keyframes float{

50%{

transform:translateY(-30px) rotateY(15deg);

}

}



@keyframes intro{

from{

opacity:0;

transform:scale(.5);

}

}



@media(max-width:800px){

.product{

grid-template-columns:1fr;

}


.hero h1{

font-size:40vw;

}


.about h1{

font-size:35px;

}

}



</style>

</head>


<body>



<div id="login">

<div class="heart">
♡
</div>

<h1>LUV</h1>

<p>PRIVATE ACCESS</p>


<input id="password" placeholder="ACCESS CODE">


<button class="loginBtn" onclick="unlock()">
ENTER
</button>


<div id="error"></div>

</div>






<div id="site" style="display:none">


<nav>

<div class="logo">
LUV<span>♡</span>
</div>


<button onclick="openCart()">

BAG (<span id="count">0</span>)

</button>

</nav>






<section class="hero">

<div>

<h1>
LUV
</h1>


<p>
DROP 001 COMING SOON
</p>


<h3>
ONLY 50 MADE
</h3>


<div class="stock">
37 / 50
</div>


</div>

</section>

<section class="drop">

<h2>
DROP 001
</h2>


<div class="product">


<div class="viewer">

<div class="shirt">

♡
<br>
LUV

</div>

</div>




<div class="info">


<h1>
LUV ESSENTIAL TEE
</h1>


<h2>
45€
</h2>


<p>
Heavyweight cotton.<br>
Limited first collection.<br>
Only 50 pieces.
</p>



<h3>
SELECT SIZE
</h3>


<div class="size">

<button onclick="selectSize('S')">
S
</button>

<button onclick="selectSize('M')">
M
</button>

<button onclick="selectSize('L')">
L
</button>

<button onclick="selectSize('XL')">
XL
</button>


</div>



<div class="selected">

SIZE:
<span id="selected">
NONE
</span>

</div>




<button class="add" onclick="addCart()">

ADD TO BAG

</button>


</div>


</div>


</section>








<section class="about">


<h1>
CREATED BY TWO FRIENDS ♡
</h1>


</section>







<div class="cart" id="cart">


<div class="cartTop">

<h2>
YOUR BAG
</h2>


<button class="close" onclick="closeCart()">
♡
</button>


</div>



<div id="items"></div>



<h2>

TOTAL:

<span id="total">
0€
</span>

</h2>


<button class="checkout">
CHECKOUT
</button>


</div>





<div class="overlay" id="overlay" onclick="closeCart()"></div>





<footer>

LUV® 2026

</footer>




</div>









<script>


let cartItems = [];

let chosenSize = "";





function unlock(){


let password =
document.getElementById("password").value;



if(password === "LUV2026"){


document.getElementById("login").style.display="none";


document.getElementById("site").style.display="block";


}


else{


document.getElementById("error").innerHTML =
"WRONG ACCESS CODE";


}


}








function selectSize(size){


chosenSize=size;


document.getElementById("selected").innerHTML=size;



document.querySelectorAll(".size button")
.forEach(button=>{

button.classList.remove("active");

});



event.target.classList.add("active");


}








function addCart(){



if(chosenSize===""){


alert("SELECT A SIZE FIRST");


return;


}





let existing = cartItems.find(item =>

item.name === "LUV ESSENTIAL TEE"

&&

item.size === chosenSize

);





if(existing){


existing.quantity++;


}


else{


cartItems.push({

name:"LUV ESSENTIAL TEE",

size:chosenSize,

price:45,

quantity:1

});


}



updateCart();



}









function updateCart(){



let box =
document.getElementById("items");



box.innerHTML="";



let total=0;

let amount=0;




cartItems.forEach((item,index)=>{


total += item.price * item.quantity;


amount += item.quantity;



box.innerHTML += `


<div class="cartItem">


<b>
${item.name}
</b>


<br>


SIZE:
${item.size}


<br><br>



<button onclick="changeQuantity(${index},-1)">
−
</button>



${item.quantity}



<button onclick="changeQuantity(${index},1)">
+
</button>



<br><br>


${item.price * item.quantity}€



<br>


<button onclick="removeItem(${index})">

REMOVE

</button>


</div>


`;



});






document.getElementById("total").innerHTML =
total+"€";



document.getElementById("count").innerHTML =
amount;



}









function changeQuantity(index,value){



cartItems[index].quantity += value;




if(cartItems[index].quantity <= 0){


cartItems.splice(index,1);


}



updateCart();



}








function removeItem(index){



cartItems.splice(index,1);



updateCart();



}









function openCart(){



document.getElementById("cart")
.classList.add("open");



document.getElementById("overlay")
.classList.add("show");



}







function closeCart(){



document.getElementById("cart")
.classList.remove("open");



document.getElementById("overlay")
.classList.remove("show");



}



</script>



</body>

</html>
